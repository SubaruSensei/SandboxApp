name: build-apk
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools platforms;android-34 build-tools;34.0.0' }
      
      - name: Install cross-compiler and Patch Libraries
        run: |
          sudo apt-get update && sudo apt-get install -y patchelf gcc-arm-linux-gnueabi
          
          cat << 'CEOF' > stubs.c
          void fmt_dummy() __asm__("_ZN3fmt2v76detail7vformatENS0_17basic_string_viewIcEENS0_11format_argsE");
          void fmt_dummy() {}
          
          void mediastub_dummy() __asm__("_ZN7android9mediastub9MediaStubC1Ev");
          void mediastub_dummy() {}
          CEOF
          
          arm-linux-gnueabi-gcc -shared -fPIC -nostdlib -o app/src/main/assets/runtime32/libfmt.so stubs.c
          
          patchelf --add-needed libfmt.so app/src/main/assets/runtime32/libinput.so
          patchelf --add-needed libfmt.so app/src/main/assets/runtime32/libstagefright.so
          patchelf --remove-needed libdovi_omx.so app/src/main/assets/runtime32/libstagefright.so
          
          echo "=== Check Patches ==="
          file app/src/main/assets/runtime32/libfmt.so
          patchelf --print-needed app/src/main/assets/runtime32/libstagefright.so | grep fmt || echo "❌ fmt stub missing in stagefright"
          
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: sandbox-apk, path: app/build/outputs/apk/debug/*.apk }
